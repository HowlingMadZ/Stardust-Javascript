<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardust canvas editor</title>
<style>
  :root { --bg:#14161b; --panel:#1b1e26; --panel2:#222733; --line:rgba(255,255,255,.09); --text:#d7dbe3; --dim:#8b93a3; --accent:#ffb547; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font:12.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); background:var(--bg); }
  #app { display:grid; grid-template-columns:190px 1fr 340px; grid-template-rows:42px 1fr; height:100%; }
  #top { grid-column:1/4; display:flex; align-items:center; gap:6px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; }
  #top .brand { font-weight:600; display:flex; align-items:center; gap:7px; margin-right:6px; }
  #top .brand i { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  #top .sp { flex:1; }
  #left { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #left h3 { margin:0; padding:9px 10px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #elist { overflow:auto; flex:1; padding:0 6px; }
  .eitem { display:flex; align-items:center; gap:7px; padding:5px 6px; border-radius:7px; cursor:pointer; border:1px solid transparent; }
  .eitem:hover { background:var(--panel2); } .eitem.on { background:var(--panel2); border-color:var(--accent); }
  .eitem canvas { border-radius:5px; flex:none; } .ename { flex:1; }
  #left .foot { padding:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  #stage { position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 40%,#232834 0%,#14161b 70%); min-width:0; }
  #stage.light { background:#e9ebef; } #stage.black { background:#000; }
  #stage.checker { background-color:#2a2d35; background-image:linear-gradient(45deg,#343843 25%,transparent 25%,transparent 75%,#343843 75%),linear-gradient(45deg,#343843 25%,transparent 25%,transparent 75%,#343843 75%); background-size:24px 24px; background-position:0 0,12px 12px; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #gz { cursor:grab; touch-action:none; }
  #vbar { position:absolute; left:10px; bottom:10px; display:flex; gap:10px; align-items:center; background:rgba(20,22,27,.82); border:1px solid var(--line); padding:5px 9px; border-radius:8px; flex-wrap:wrap; max-width:calc(100% - 20px); }
  #vbar label { display:flex; gap:4px; align-items:center; color:var(--dim); cursor:pointer; }
  #stats,#coords { position:absolute; right:10px; top:8px; color:var(--dim); font-variant-numeric:tabular-nums; background:rgba(20,22,27,.7); padding:2px 8px; border-radius:6px; pointer-events:none; }
  #coords { top:32px; }
  #warn { position:absolute; left:10px; top:8px; max-width:50%; white-space:pre-line; color:#f0b46a; font-size:12px; display:none; background:rgba(20,22,27,.8); padding:5px 9px; border-radius:6px; }
  #msg { position:absolute; left:50%; top:12px; transform:translateX(-50%); padding:7px 14px; border-radius:8px; display:none; z-index:5; }
  #msg.ok { background:#1d3a28; border:1px solid #2f7a4a; color:#b6f0c8; } #msg.err { background:#3a1d1d; border:1px solid #7a3535; color:#ffb3b3; }
  #right { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #inspector { overflow:auto; flex:1; padding:6px 8px 40px; }
  .empty { color:var(--dim); padding:20px; }
  details.sec { margin-bottom:6px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  details.sec > summary { padding:7px 10px; cursor:pointer; font-weight:600; user-select:none; }
  details.sec > :not(summary) { margin:0 8px 8px; }
  .prow { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .prow label { width:92px; flex:none; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chkrow label { width:auto; color:var(--text); cursor:pointer; }
  .prow input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:16px; }
  input.num.txt { width:120px; text-align:left; }
  input.num { width:62px; background:#14161b; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:2px 4px; font:inherit; text-align:right; }
  input[type=checkbox] { accent-color:var(--accent); }
  input[type=color] { width:30px; height:22px; padding:0; border:1px solid var(--line); background:none; border-radius:4px; }
  select,button { font:inherit; color:var(--text); background:#2a3040; border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  select { min-width:0; } .prow select { flex:1; }
  button { cursor:pointer; } button:hover:not(:disabled),select:hover { border-color:rgba(255,255,255,.25); } button:disabled { opacity:.35; cursor:default; }
  button.primary { background:var(--accent); color:#1a1405; border-color:transparent; font-weight:600; }
  button.mini { padding:0 6px; line-height:18px; background:transparent; border-color:transparent; color:var(--dim); } button.mini:hover { color:#fff; }
  button.add,select.addsel { width:100%; margin-top:6px; background:transparent; border:1px dashed rgba(255,255,255,.2); color:var(--dim); text-align:left; }
  button.fire { background:#4a2d12; border-color:#8a5320; color:#ffcf99; padding:2px 8px; }
  .card { border:1px solid var(--line); border-radius:7px; margin:5px 0; background:#1e222c; } .card.selected { border-color:var(--accent); }
  .cardhead { display:flex; align-items:center; gap:6px; padding:5px 7px; cursor:pointer; user-select:none; } .ctitle { flex:1; font-weight:500; } .arrow { color:var(--dim); width:10px; }
  .cardbody { padding:2px 9px 8px; } .desc { color:var(--dim); font-size:11.5px; margin:3px 0 6px; }
  .group { margin:6px 0; } .glabel { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:2px; }
  .sub { border:1px solid var(--line); border-left:3px solid #55607a; border-radius:6px; margin:4px 0; background:#191c24; } .sub.selected { border-left-color:var(--accent); }
  .subhead { display:flex; align-items:center; gap:6px; padding:3px 6px; cursor:pointer; } .subhead select,.subhead span { flex:1; } .subbody { padding:2px 8px 6px; }
  .gradbar { height:16px; border-radius:4px; border:1px solid var(--line); margin:2px 0 6px; } .gstop input[type=range] { flex:1; } .tiny { font-size:10.5px; color:var(--dim); }
  .tex { display:flex; flex-wrap:wrap; gap:6px; } .texitem { position:relative; display:flex; flex-direction:column; align-items:center; background:#14161b; border:1px solid var(--line); border-radius:6px; padding:3px; }
  .texitem canvas { background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0 0/8px 8px; border-radius:3px; } .texitem button { position:absolute; top:0; right:0; }
  #pname { background:#14161b; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 7px; width:140px; font:inherit; }
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,12,16,.72); border:2px dashed var(--accent); font-size:20px; color:var(--accent); z-index:10; pointer-events:none; } #drop.on { display:flex; }
  #help { color:var(--dim); font-size:11.5px; padding:6px 10px; border-top:1px solid var(--line); }
  input[type=file] { display:none; }
  #speedw { display:flex; align-items:center; gap:5px; color:var(--dim); } #speed { width:80px; accent-color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="brand"><i></i>Stardust editor</span>
    <button id="open" title="Open .sde (or drop it on the window)">Open…</button>
    <button id="save" class="primary" title="Ctrl+S">Save .sde</button>
    <input id="pname" title="File name" value="untitled">
    <select id="examples" title="Start from an example"><option value="">Examples…</option><option value="fire">Fire</option><option value="fountain">Fountain</option><option value="attract">Attraction points</option><option value="firework">Firework (spawn)</option><option value="blank">Blank</option></select>
    <button id="undo" title="Ctrl+Z">↶ Undo</button><button id="redo" title="Ctrl+Shift+Z">↷ Redo</button>
    <span class="sp"></span>
    <button id="pause">Pause</button><button id="restart">Restart</button>
    <span id="speedw">speed <input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span id="speedv">1.00×</span></span>
    <select id="bgstyle" title="Editor background"><option value="">Dark</option><option value="black">Black</option><option value="light">Light</option><option value="checker">Checker</option></select>
  </div>
  <div id="left">
    <h3>Emitters</h3>
    <div id="elist"></div>
    <div class="foot">
      <button id="newem">＋ New emitter</button>
      <button id="cloneem">Clone emitter</button>
      <button id="setbg" title="Also used as the test sprite for Image-mask zones">Set test background / sprite…</button>
      <div id="bgrow" style="display:none;gap:6px;align-items:center;flex-wrap:wrap"><label class="tiny"><input type="checkbox" id="showbg" checked> show</label><label class="tiny" title="Backgrounds are only a preview aid; leave this off for the final export"><input type="checkbox" id="inclbg"> save in file</label><button id="rmbg" class="mini">remove</button></div>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas><canvas id="gz"></canvas>
    <div id="warn"></div><div id="stats"></div><div id="coords"></div><div id="msg"></div>
    <div id="vbar">
      <label><input type="checkbox" id="gizmos" checked> Gizmos</label>
      <label title="Off: only the selected card is drawn"><input type="checkbox" id="showall" checked> All shapes</label>
      <label><input type="checkbox" id="smooth"> Smooth</label>
      <span id="zoomv" class="tiny">100%</span><button id="resetview" class="mini">reset view</button>
      <span class="tiny">drag = pan · wheel = zoom · click = burst/fire · drag squares to edit (Shift = snap 10)</span>
    </div>
  </div>
  <div id="right"><div id="inspector"></div></div>
</div>
<div id="drop">Drop a .sde or an image</div>
<input type="file" id="sdefile" accept=".sde,.zip" multiple><input type="file" id="imgfile" accept="image/*" multiple><input type="file" id="bgfile" accept="image/*">

      ctx.restore();
    });
    handles.forEach(function (h) {
      var s = w2s(h.x, h.y); ctx.beginPath(); ctx.rect(s[0] - 4.5, s[1] - 4.5, 9, 9); ctx.fillStyle = '#14161b'; ctx.fill(); ctx.strokeStyle = h.color; ctx.lineWidth = h.sel ? 2 : 1.2; ctx.stroke();
    });
  }

  /* ---- ui/view/Pointer.js ---- */
  // Pointer interaction: drag handles, pan, zoom, click to fire
  // pointer interaction: drag handles, pan with middle / space / empty drag, wheel zoom, click = fire action under mouse
  var drag = null;
  function pos(ev) { var r = gz.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  gz.addEventListener('pointerdown', function (ev) {
    var p = pos(ev), hit = null;
    if ($('gizmos').checked) for (var i = handles.length - 1; i >= 0; i--) { var s = w2s(handles[i].x, handles[i].y); if (Math.abs(s[0] - p[0]) < 8 && Math.abs(s[1] - p[1]) < 8) { hit = handles[i]; break; } }
    gz.setPointerCapture(ev.pointerId);
    if (hit && ev.button === 0) {
      pushUndo(true); drag = { kind: 'handle', h: hit }; if (hit.onselect) { selCard = hit.onselect; highlightSel(); }
    } else drag = { kind: 'pan', x: p[0], y: p[1], vx: player.viewX, vy: player.viewY, moved: false, button: ev.button };
  });
  gz.addEventListener('pointermove', function (ev) {
    var p = pos(ev), w = s2w(p[0], p[1]); $('coords').textContent = 'x ' + w[0].toFixed(0) + '  y ' + w[1].toFixed(0);
    if (!drag) {
      var over = false;
      for (var i = 0; i < handles.length; i++) { var s = w2s(handles[i].x, handles[i].y); if (Math.abs(s[0] - p[0]) < 8 && Math.abs(s[1] - p[1]) < 8) over = true; }
      gz.style.cursor = over ? 'move' : 'grab'; return;
    }
    if (drag.kind === 'handle') {
      var sn = ev.shiftKey ? 10 : 1; drag.h.drag(Math.round(w[0] / sn) * sn, Math.round(w[1] / sn) * sn);
      var what = 'all'; live('initializers'); live('actions'); refreshValues(); drawGizmos();
    } else {
      var dx = p[0] - drag.x, dy = p[1] - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      player.viewX = drag.vx + dx; player.viewY = drag.vy + dy; drawGizmos(); gz.style.cursor = 'grabbing';
    }
  });
  gz.addEventListener('pointerup', function (ev) {
    if (drag && drag.kind === 'pan' && !drag.moved && drag.button === 0) {
      // click: fire all "fire" actions of the selected emitter at their usual place and trigger a burst
      var lv = cur() && liveFor(cur());
      if (lv) { var fired = false; lv.actions.forEach(function (a) { if (a.fire) { a.fire(); fired = true; } }); if (lv.clock.impulse) lv.clock.impulse(); else if (!fired) lv.createParticles(Math.max(1, Math.round(cur().spec.clock.ticksPerCall / 4))); }
    }
    if (drag && drag.kind === 'handle') renderInspector();
    drag = null; gz.style.cursor = 'grab';
  });
  gz.addEventListener('wheel', function (ev) {
    ev.preventDefault(); var p = pos(ev), w = s2w(p[0], p[1]), k = Math.exp(-ev.deltaY * 0.0015);
    player.viewZoom = Math.min(8, Math.max(0.1, player.viewZoom * k));
    player.viewX = p[0] - w[0] * player.viewZoom; player.viewY = p[1] - w[1] * player.viewZoom; $('zoomv').textContent = Math.round(player.viewZoom * 100) + '%'; drawGizmos();
  }, { passive: false });
  function refreshValues() { // update visible inputs while dragging handles without rebuilding the DOM
    document.querySelectorAll('#inspector .prow input.num').forEach(function (n) { /* values refreshed lazily on mouseup via renderInspector */ });
  }

  /* ---- ui/FileIO.js ---- */
  // Open / save .sde, images and the test background
  // ------------------------------------------------------------------ file IO
  function download(name, bytes, mime) {
    var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
    var a = document.createElement('a'); a.download = name; a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function msg(text, isErr) { var m = $('msg'); m.textContent = text; m.className = isErr ? 'err' : 'ok'; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(function () { m.style.display = 'none'; }, isErr ? 7000 : 2500); }
  function saveSde() {
    var o = { emitters: project.emitters.map(function (pe) { return { id: pe.id, spec: pe.spec, frames: pe.frames }; }), background: project.background, includeBackground: project.includeBackground };
    if (!o.emitters.length) return msg('Nothing to save: add an emitter first', true);
    E.buildSde(o).then(function (bytes) {
      var name = (project.name || 'effect').replace(/[^\w\-. ]+/g, '_');
      download(name + '.sde', bytes); msg('Saved ' + name + '.sde (' + Math.round(bytes.length / 1024) + ' KB)');
    }, function (e) { msg(e.message, true); });
  }
  function loadBuffer(buf, name) {
    return E.loadSde(buf).then(function (r) {
      pushUndo(true);
      project.emitters = r.emitters; project.name = (name || 'effect').replace(/^[0-9a-f]{8}-/, '').replace(/\.sde$/i, '');
      project.background = r.background; project.includeBackground = false; sel = 0; selCard = null; openList = [];
      fakeSim.backgroundImage = r.background ? r.background.img : null; fakeSim.hasBackground = !!r.background;
      if (r.stageMode) { /* background top-left sits at the stage origin */ fitStage(r.stageW, r.stageH); }
      else { player.viewX = W / 2; player.viewY = H / 2; player.viewZoom = 1; $('zoomv').textContent = '100%'; }
      warnings = r.warnings.slice(); reinstantiate(); renderAll();
      msg('Loaded ' + project.emitters.length + ' emitter(s)');
    }).catch(function (e) { msg('Could not open file: ' + (e && e.message || e), true); });
  }
  function fitStage(sw, sh) { var k = Math.min(W / sw, H / sh) * 0.95; player.viewZoom = k; player.viewX = (W - sw * k) / 2; player.viewY = (H - sh * k) / 2; $('zoomv').textContent = Math.round(k * 100) + '%'; }
  function readFile(f, cb) { var r = new FileReader(); r.onload = function () { cb(r.result); }; r.readAsArrayBuffer(f); }
  function openFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      if (/\.sde$|\.zip$/i.test(f.name)) readFile(f, function (b) { loadBuffer(b, f.name); });
      else if (/^image\//.test(f.type)) readFile(f, function (b) {
        var bytes = new Uint8Array(b);
        if (/background/i.test(f.name) && !cur()) return;
        E.imageToCanvas(bytes, f.type).then(function (c) {
          var pe = cur(); if (!pe) return msg('Add an emitter first', true);
          pushUndo(true); pe.frames = pe.frames.concat([{ name: f.name, canvas: c }]); syncFrames(); renderInspector(); renderList();
        }, function () { msg('Could not decode ' + f.name, true); });
      });
    });
  }
  // the background image doubles as the test sprite for ImageMask zones (mask name 'mask' and 'background'),
  // placed with its top-left corner at the world origin, exactly where it is drawn
  function registerMask(img) {
    try { S.Masks.set('mask', img, { x: 0, y: 0, anchor: 'topleft' }); S.Masks.set('background', img, { x: 0, y: 0, anchor: 'topleft' }); reinstantiate(); }
    catch (e) { msg('Could not read the image pixels (' + e.message + '). Use a file chosen with the button, not a cross-origin image.', true); }
  }
  function setBackground(f) {
    readFile(f, function (b) {
      var bytes = new Uint8Array(b);
      S.io.loadImage(bytes, f.type || 'image/png').then(function (img) {
        project.background = { bytes: bytes, img: img }; registerMask(img); fitStage(img.width, img.height); fakeSim.backgroundImage = img; fakeSim.hasBackground = true; showBg = true; player.showBackground = true; renderAll();
        msg('Test background set (only for previewing; it is not exported unless you tick the box)');
      }, function () { msg('Could not decode that image', true); });
    });
  }

  /* ---- ui/Examples.js ---- */
  // Built-in example effects
  // ------------------------------------------------------------------ examples
  function example(name) {
    if (name.indexOf('sde:') === 0) {
      var it = (window.__EXAMPLES__ || [])[+name.slice(4)]; if (!it) return;
      var bin = atob(it.b64), u8 = new Uint8Array(bin.length); for (var q = 0; q < bin.length; q++) u8[q] = bin.charCodeAt(q);
      return loadBuffer(u8.buffer, it.name);
    }
    pushUndo(true); openList = []; selCard = null;
    var mk = function (id) { return E.createEmitter(String(id)); };
    var tex = function (n) { return { name: n, canvas: E.builtinTextures[n]() }; };
    var em, em2, sp, A = function (t, o) { return Object.assign(E.create('action', t), o || {}); };
    function setInit(spec, type, patch) { var i = spec.initializers.filter(function (x) { return x.$type === type; })[0]; Object.assign(i, patch); return i; }
    function gradient(c, r, a) { return { $type: 'ColorGradient', active: true, gradient: { colors: c, ratios: r, alphas: a }, numSteps: 500 }; }
    function swap(spec, type, repl) { spec.actions = spec.actions.filter(function (a) { return a.$type !== type; }); if (repl) spec.actions.push(repl); }
    if (name === 'fountain') {
      sp = mk(1); sp.clock.ticksPerCall = 120;
      setInit(sp, 'Velocity', { zones: [Object.assign(E.create('zone', 'Sector'), { minRadius: 250, maxRadius: 420, minAngle: 245, maxAngle: 295 })] });
      setInit(sp, 'Life', { random: { center: 2.2, radius: 0.3 } }); setInit(sp, 'Scale', { random: { center: 0.4, radius: 0.1 } });
      sp.actions.push(A('Gravity', { fields: [Object.assign(E.create('field', 'UniformField'), { y: 8 })] }));
      swap(sp, 'AlphaCurve', A('AlphaCurve', { inLifespan: 0.1, outLifespan: 0.6 }));
      sp.particleHandler.blendMode = 'add';
      sp.actions.push(gradient([0xaee6ff, 0x2a7bff], [0, 255], [1, 1]));
      swap(sp, 'AlphaCurve', null);
      var dz = A('DeathZone', { zones: [Object.assign(E.create('zone', 'RectZone'), { x: -600, y: 200, width: 1200, height: 400 })] }); sp.actions.push(dz);
      project.emitters = [{ id: '1', spec: sp, frames: [tex('Soft dot')] }];
    } else if (name === 'fire') {
      sp = mk(1); sp.clock.ticksPerCall = 70; sp.particleHandler.blendMode = 'add';
      setInit(sp, 'PositionAnimated', { zones: [Object.assign(E.create('zone', 'RectZone'), { x: -40, y: 0, width: 80, height: 6 })] });
      setInit(sp, 'Velocity', { zones: [Object.assign(E.create('zone', 'Sector'), { minRadius: 40, maxRadius: 110, minAngle: 255, maxAngle: 285 })] });
      setInit(sp, 'Life', { random: { center: 1.2, radius: 0.4 } }); setInit(sp, 'Scale', { random: { center: 0.9, radius: 0.3 } });
      swap(sp, 'AlphaCurve', null);
      sp.actions.push(A('ScaleCurve', { inScale: 0.3, inLifespan: 0.2, outScale: 0, outLifespan: 0.9 }));
      sp.actions.push(A('RandomDrift', { randomX: { center: 0, radius: 12 }, randomY: { center: 0, radius: 1 } }));
      sp.actions.push(gradient([0xffffff, 0xffc83d, 0xff4a0f, 0x300800], [0, 60, 150, 255], [1, 1, 0.8, 0]));
      project.emitters = [{ id: '1', spec: sp, frames: [tex('Soft dot')] }];
    } else if (name === 'attract') {
      sp = mk(1); sp.clock.ticksPerCall = 40; sp.particleHandler.blendMode = 'add';
      setInit(sp, 'PositionAnimated', { zones: [Object.assign(E.create('zone', 'CircleContour'), { x: -250, y: 120, radius: 20 })] });
      setInit(sp, 'Velocity', { zones: [Object.assign(E.create('zone', 'CircleZone'), { radius: 60 })] });
      setInit(sp, 'Life', { random: { center: 5, radius: 0.5 } }); setInit(sp, 'Scale', { random: { center: 0.3, radius: 0.05 } });
      var fw = E.create('action', 'FollowWaypoints'); fw.loop = false; fw.massless = true;
      fw.waypoints = [{ x: -100, y: -150, radius: 40, strength: 2.2, attenuationPower: 0, epsilon: 1 }, { x: 120, y: -50, radius: 40, strength: 2.2, attenuationPower: 0, epsilon: 1 }, { x: 260, y: 140, radius: 40, strength: 2.2, attenuationPower: 0, epsilon: 1 }];
      sp.actions.push(fw, A('Damping', { damping: 0.04 }), gradient([0x66ffe0, 0xff66cc], [0, 255], [1, 0.2]));
      swap(sp, 'AlphaCurve', null);
      project.emitters = [{ id: '1', spec: sp, frames: [tex('Spark')] }];
    } else if (name === 'firework') {
      sp = mk(1); sp.clock.ticksPerCall = 0.9;
      sp.particleHandler.blendMode = 'add'; setInit(sp, 'Life', { random: { center: 1, radius: 0.1 } }); setInit(sp, 'Scale', { random: { center: 0.5, radius: 0.1 } });
      setInit(sp, 'PositionAnimated', { zones: [Object.assign(E.create('zone', 'RectZone'), { x: -200, y: 150, width: 400, height: 10 })] });
      setInit(sp, 'Velocity', { zones: [Object.assign(E.create('zone', 'Sector'), { minRadius: 380, maxRadius: 480, minAngle: 255, maxAngle: 285 })] });
      sp.actions.push(A('Gravity', { fields: [Object.assign(E.create('field', 'UniformField'), { y: 4 })] }), gradient([0xffffff, 0xffd060], [0, 255], [1, 1]));
      swap(sp, 'AlphaCurve', null);
      var spn = A('Spawn', { spawnerEmitter: '2', trigger: E.create('trigger', 'DeathTrigger') }); sp.actions.push(spn);
      em2 = mk(2); em2.active = false; em2.clock.ticksPerCall = 3000; // only emits when spawned em2.particleHandler.blendMode = 'add';
      setInit(em2, 'Velocity', { zones: [Object.assign(E.create('zone', 'CircleZone'), { radius: 140 })] });
      setInit(em2, 'Life', { random: { center: 1.4, radius: 0.3 } }); setInit(em2, 'Scale', { random: { center: 0.35, radius: 0.1 } });
      em2.actions.push(A('Damping', { damping: 0.03 }), A('Gravity', { fields: [Object.assign(E.create('field', 'UniformField'), { y: 1.5 })] }), gradient([0xff5599, 0x5599ff], [0, 255], [1, 0]));
      swap(em2, 'AlphaCurve', null);
      spn.spawnerEmitter = '2'; spn.inheritVelocity = false; spn.inheritDirection = false;
      project.emitters = [{ id: '1', spec: sp, frames: [tex('Spark')] }, { id: '2', spec: em2, frames: [tex('Soft dot')] }];
    } else {
      project.emitters = []; newEmitter(); project.name = 'untitled'; project.background = null; fakeSim.backgroundImage = null; fakeSim.hasBackground = false; return;
    }
    project.name = name; project.background = null; fakeSim.backgroundImage = null; fakeSim.hasBackground = false;
    sel = 0; player.viewX = W / 2; player.viewY = H / 2; player.viewZoom = 1;
    warnings = []; reinstantiate(); renderAll();
  }

  /* ---- ui/Wiring.js ---- */
  // Binding the toolbar, keyboard and drag-and-drop
  // ------------------------------------------------------------------ wiring
  function bind() {
    $('undo').onclick = undo; $('redo').onclick = redo;
    $('open').onclick = function () { $('sdefile').click(); };
    $('sdefile').onchange = function (e) { openFiles(e.target.files); e.target.value = ''; };
    $('imgfile').onchange = function (e) { openFiles(e.target.files); e.target.value = ''; };
    $('bgfile').onchange = function (e) { if (e.target.files[0]) setBackground(e.target.files[0]); e.target.value = ''; };
    $('setbg').onclick = function () { $('bgfile').click(); };
    $('save').onclick = saveSde;
    $('newem').onclick = newEmitter; $('cloneem').onclick = cloneEmitter;
    var ex = $('examples'); (window.__EXAMPLES__ || []).forEach(function (it, i) { var o = document.createElement('option'); o.value = 'sde:' + i; o.textContent = it.name; ex.appendChild(o); });
    $('pname').onchange = function () { project.name = this.value; };
    $('examples').onchange = function () { if (this.value) example(this.value); this.value = ''; };
    $('pause').onclick = function () { player.timeScale = player.timeScale ? 0 : parseFloat($('speed').value); this.textContent = player.timeScale ? 'Pause' : 'Play'; };
    $('restart').onclick = function () { reinstantiate(); };
    $('speed').oninput = function () { if (player.timeScale) player.timeScale = parseFloat(this.value); $('speedv').textContent = parseFloat(this.value).toFixed(2) + '×'; };
    $('gizmos').onchange = drawGizmos;
    $('showall').onchange = function () { showAll = this.checked; drawGizmos(); };
    $('showbg').onchange = function () { showBg = this.checked; player.showBackground = showBg; };
    $('inclbg').onchange = function () { project.includeBackground = this.checked; };
    $('rmbg').onclick = function () { project.background = null; project.includeBackground = false; fakeSim.backgroundImage = null; fakeSim.hasBackground = false; updateTitle(); };
    $('resetview').onclick = function () { player.viewX = W / 2; player.viewY = H / 2; player.viewZoom = 1; $('zoomv').textContent = '100%'; drawGizmos(); };
    $('bgstyle').onchange = function () { $('stage').className = this.value; };
    $('smooth').onchange = function () { player.forceSmoothing = this.checked; };
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveSde(); }
      else if (tag !== 'input' && tag !== 'select' && e.code === 'Space') { e.preventDefault(); $('pause').click(); }
    });
    var dropEl = $('drop'), depth = 0;
    window.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; dropEl.classList.add('on'); });
    window.addEventListener('dragleave', function () { if (--depth <= 0) { depth = 0; dropEl.classList.remove('on'); } });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); depth = 0; dropEl.classList.remove('on'); if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files); });
    window.addEventListener('resize', resize);
    window.addEventListener('beforeunload', function (e) { if (undoStack.length > 3) { e.preventDefault(); e.returnValue = ''; } });
    player.onframe = function () {
      $('stats').textContent = player.numParticles + ' particles · ' + Math.round(player.fpsSmooth) + ' fps';
    };
  }

  /* ---- ui/Init.js ---- */
  // Start-up
  function init() {
    bind(); resize(); updateUndoBtns();
    var qs = location.search.match(/[?&]sde=([^&]+)/);
    example('fire');
    undoStack = []; redoStack = []; updateUndoBtns();
    player.start();
    if (qs && /^https?:|^[\w./-]+\.sde$/i.test(decodeURIComponent(qs[1]))) {
      var x = new XMLHttpRequest(); x.open('GET', decodeURIComponent(qs[1])); x.responseType = 'arraybuffer';
      x.onload = function () { if (x.response) loadBuffer(x.response, qs[1].split('/').pop()); }; x.send();
    }
    window.__editor = { project: project, player: player, E: E, load: loadBuffer, save: function () { return E.buildSde({ emitters: project.emitters, background: project.background, includeBackground: project.includeBackground }); }, example: example, undo: undo, redo: redo, select: function (i) { sel = i; renderAll(); } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
